<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reviews & Ratings | FreelanceHub</title>

<link rel="stylesheet" href="css/reviews.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav class="navbar">

<h2>FreelanceHub</h2>

<a href="payments.html" class="back-btn">
<i class="fa-solid fa-arrow-left"></i> Back
</a>

</nav>

<div class="container">

<div class="review-card">

<h1>Rate Your Experience</h1>

<p>Share your feedback about this completed project.</p>

<div class="stars">

<i class="fa-regular fa-star star" data-value="1"></i>
<i class="fa-regular fa-star star" data-value="2"></i>
<i class="fa-regular fa-star star" data-value="3"></i>
<i class="fa-regular fa-star star" data-value="4"></i>
<i class="fa-regular fa-star star" data-value="5"></i>

</div>

<textarea
id="reviewText"
placeholder="Write your review here..."
rows="6"
required>
</textarea>

<div class="summary">

<div class="box">

<h3>Average Rating</h3>

<p>⭐⭐⭐⭐⭐ (4.9)</p>

</div>

<div class="box">

<h3>Projects Completed</h3>

<p>58</p>

</div>

<div class="box">

<h3>Client Satisfaction</h3>

<p>98%</p>

</div>

</div>

<button id="submitReview">

Submit Review

</button>

</div>

</div>

<script src="js/reviews.js"></script>

</body>

</html>
