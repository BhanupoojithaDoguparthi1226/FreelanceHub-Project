<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | FreelanceHub</title>

<link rel="stylesheet" href="css/login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- Animated Background -->

<div class="background">

<div class="shape s1"></div>
<div class="shape s2"></div>
<div class="shape s3"></div>

<i class="fa-solid fa-laptop-code icon i1"></i>
<i class="fa-solid fa-briefcase icon i2"></i>
<i class="fa-solid fa-comments-dollar icon i3"></i>
<i class="fa-solid fa-user-tie icon i4"></i>
<i class="fa-solid fa-chart-line icon i5"></i>

</div>

<!-- Login Card -->

<div class="container">

<form id="loginForm">

<h2>Welcome Back</h2>

<p class="subtitle">
Login to continue your freelance journey.
</p>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<span id="togglePassword">
<i class="fa-solid fa-eye"></i>
</span>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">Forgot Password?</a>

</div>

<button type="submit">

Login

</button>

<p class="register">

Don't have an account?

<a href="register.html">

Register

</a>

</p>

</form>

</div>

<script src="js/login.js"></script>

</body>

</html>
