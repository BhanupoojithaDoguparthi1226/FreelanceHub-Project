<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payments | FreelanceHub</title>

<link rel="stylesheet" href="css/payments.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav class="navbar">

<h2>FreelanceHub</h2>

<a href="contracts.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>

</nav>

<div class="container">

<div class="payment-card">

<h1>Payment Summary</h1>

<div class="summary">

<div class="box">

<i class="fa-solid fa-wallet"></i>

<h3>Total Amount</h3>

<p>₹25,000</p>

</div>

<div class="box">

<i class="fa-solid fa-circle-check"></i>

<h3>Status</h3>

<p class="success">Pending</p>

</div>

<div class="box">

<i class="fa-solid fa-calendar"></i>

<h3>Payment Date</h3>

<p>15 July 2026</p>

</div>

<div class="box">

<i class="fa-solid fa-credit-card"></i>

<h3>Method</h3>

<p>Credit Card</p>

</div>

</div>

<h2>Transaction History</h2>

<table>

<tr>

<th>ID</th>

<th>Date</th>

<th>Amount</th>

<th>Status</th>

</tr>

<tr>

<td>#TR1001</td>

<td>10 Jul 2026</td>

<td>₹10,000</td>

<td class="completed">Completed</td>

</tr>

<tr>

<td>#TR1002</td>

<td>12 Jul 2026</td>

<td>₹5,000</td>

<td class="completed">Completed</td>

</tr>

<tr>

<td>#TR1003</td>

<td>15 Jul 2026</td>

<td>₹10,000</td>

<td class="pending">Pending</td>

</tr>

</table>

<div class="buttons">

<button id="invoice">

Download Invoice

</button>

<button id="pay">

Complete Payment

</button>

</div>

</div>

</div>

<script src="js/payments.js"></script>

</body>

</html>
