<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | FreelanceHub</title>

<link rel="stylesheet" href="css/register.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="background">

<div class="shape s1"></div>
<div class="shape s2"></div>
<div class="shape s3"></div>

<i class="fa-solid fa-laptop-code icon i1"></i>
<i class="fa-solid fa-briefcase icon i2"></i>
<i class="fa-solid fa-comments icon i3"></i>
<i class="fa-solid fa-money-bill-wave icon i4"></i>
<i class="fa-solid fa-user-tie icon i5"></i>

</div>

<div class="container">

<form>

<h2>Create Account</h2>

<div class="input-box">
<input type="text" placeholder="Full Name" required>
</div>

<div class="input-box">
<input type="email" placeholder="Email Address" required>
</div>

<div class="input-box">
<input type="password" placeholder="Password" required>
</div>

<div class="input-box">
<input type="password" placeholder="Confirm Password" required>
</div>

<div class="role">

<label>
    <input type="radio" name="role" value="client">
    Client
</label>

<label>
    <input type="radio" name="role" value="freelancer">
    Freelancer
</label>

</div>

<button>Create Account</button>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</form>

</div>

<script src="js/register.js"></script>

</body>
</html>
