<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Details | FreelanceHub</title>

<link rel="stylesheet" href="css/project-details.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="background">

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<i class="fa-solid fa-laptop-code icon i1"></i>
<i class="fa-solid fa-code icon i2"></i>
<i class="fa-solid fa-briefcase icon i3"></i>
<i class="fa-solid fa-diagram-project icon i4"></i>

</div>

<nav class="navbar">

<h2>FreelanceHub</h2>

<a href="browse-projects.html" class="back-btn">
<i class="fa-solid fa-arrow-left"></i> Back
</a>

</nav>

<div class="container">

<div class="project-card">

<h1 id="title"></h1>

<div class="tags">

<span id="category"></span>
<span>Full Stack</span>
<span>Urgent</span>

</div>

<p class="description" id="description"></p>

<div class="details">

<div>
<i class="fa-solid fa-wallet"></i>
<strong>Budget</strong>
<p id="budget"></p>
</div>

<div>
<i class="fa-solid fa-calendar"></i>
<strong>Deadline</strong>
<p>20 Days</p>
</div>

<div>
<i class="fa-solid fa-location-dot"></i>
<strong>Location</strong>
<p>Remote</p>
</div>

<div>
<i class="fa-solid fa-user"></i>
<strong>Posted By</strong>
<p>ABC Technologies</p>
</div>

</div>

<h2>Required Skills</h2>

<div class="skills">

<span>HTML</span>
<span>CSS</span>
<span>JavaScript</span>
<span>React</span>
<span>Node.js</span>
<span>SQL</span>

</div>

<h2>Attachments</h2>

<ul class="files">

<li><i class="fa-solid fa-file-pdf"></i> Project Requirements.pdf</li>

<li><i class="fa-solid fa-image"></i> UI Mockup.png</li>

</ul>

<button id="bidBtn">

Place a Bid

</button>

</div>

</div>

<script src="js/project-details.js"></script>

</body>

</html>
