<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messages | FreelanceHub</title>

<link rel="stylesheet" href="css/messages.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="chat-container">

<!-- Left Sidebar -->

<div class="chat-list">

<div class="chat-header">

<h2>Messages</h2>

</div>

<div class="user active">

<img src="https://i.pravatar.cc/60?img=12">

<div>

<h4>ABC Technologies</h4>

<p>Online</p>

</div>

</div>

<div class="user">

<img src="https://i.pravatar.cc/60?img=32">

<div>

<h4>John Smith</h4>

<p>Last seen 5 min ago</p>

</div>

</div>

<div class="user">

<img src="https://i.pravatar.cc/60?img=15">

<div>

<h4>Creative Studio</h4>

<p>Online</p>

</div>

</div>

</div>

<!-- Chat Area -->

<div class="chat-box">

<div class="top-bar">

<h3>ABC Technologies</h3>

<span class="status">🟢 Online</span>

</div>

<div class="messages">

<div class="received">

Hello! Can you complete the website in 20 days?

</div>

<div class="sent">

Yes, I can complete it within 20 days.

</div>

<div class="received">

Great! Please submit your proposal.

</div>

</div>

<div class="message-input">

<button><i class="fa-solid fa-paperclip"></i></button>

<input
type="text"
id="message"
placeholder="Type your message...">

<button><i class="fa-regular fa-face-smile"></i></button>

<button id="send">

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

</div>

</div>

<script src="js/messages.js"></script>

</body>

</html>
