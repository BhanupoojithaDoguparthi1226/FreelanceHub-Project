<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | FreelanceHub</title>

<link rel="stylesheet" href="css/profile.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav class="navbar">

<h2>FreelanceHub</h2>

<a href="reviews.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>

</nav>

<div class="container">

<div class="profile-card">

<img src="https://www.pngkey.com/png/detail/115-1150152_default-profile-picture-avatar-png-green.png" alt="Profile">

<h1 id="fullname">Loading...</h1>

<p class="role" id="role">Loading...</p>

<div class="details">

<div class="detail">

<i class="fa-solid fa-envelope"></i>

<span id="email">Loading...</span>

</div>

<div class="detail">

<i class="fa-solid fa-phone"></i>

<span>+91 9876543210</span>

</div>

<div class="detail">

<i class="fa-solid fa-location-dot"></i>

<span>Andhra Pradesh, India</span>

</div>

</div>

<h2>Skills</h2>

<div class="skills">

<span>HTML</span>
<span>CSS</span>
<span>JavaScript</span>
<span>Python</span>
<span>Java</span>
<span>C++</span>

</div>

<h2>Statistics</h2>

<div class="stats">

<div class="box">

<h3>58</h3>

<p>Projects</p>

</div>

<div class="box">

<h3>4.9⭐</h3>

<p>Rating</p>

</div>

<div class="box">

<h3>₹2.5L</h3>

<p>Earnings</p>

</div>

</div>

<div class="buttons">

<button id="editBtn">

Edit Profile

</button>

<button id="passwordBtn">

Change Password

</button>

<button id="logoutBtn">

Logout

</button>

</div>

</div>

</div>

<script src="js/profile.js"></script>

</body>

</html>
